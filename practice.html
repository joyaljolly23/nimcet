<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>NIMCET PrepHub — Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo"><i class="ti ti-school"></i> NIMCET <span>PrepHub</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="syllabus.html">Syllabus</a>
      <a href="notes.html">Notes</a>
      <a href="practice.html" class="active">Practice</a>
      <a href="papers.html">Papers</a>
      <a href="mock-test.html">Mock Test</a>
      <a href="pricing.html">Pricing</a>
    </div>
    <button class="nav-cta">Start Prep <i class="ti ti-arrow-right"></i></button>
  </div>
</nav>

<div class="page-hero">
  <h1><i class="ti ti-help-circle"></i> Practice MCQs</h1>
  <p>Filter by subject and test yourself with instant answer feedback</p>
</div>

<div class="section-wrap">
<div class="section">
  <div class="mcq-box">
    <div class="mcq-filters">
      <button class="filter-btn active" onclick="filterMCQ(this,'all')">All</button>
      <button class="filter-btn" onclick="filterMCQ(this,'math')">Mathematics</button>
      <button class="filter-btn" onclick="filterMCQ(this,'cs')">Computer Science</button>
      <button class="filter-btn" onclick="filterMCQ(this,'reasoning')">Reasoning</button>
      <button class="filter-btn" onclick="filterMCQ(this,'english')">English</button>
    </div>
    <div class="mcq-question" id="mcq-area"></div>
    <div class="mcq-nav">
      <button onclick="prevQ()"><i class="ti ti-arrow-left"></i> Prev</button>
      <button id="reveal-btn" onclick="revealAnswer()"><i class="ti ti-eye"></i> Show Answer</button>
      <button onclick="nextQ()">Next <i class="ti ti-arrow-right"></i></button>
    </div>
  </div>
</div>
</div>

<footer>
  <div class="logo"><i class="ti ti-school"></i> NIMCET PrepHub</div>
  <p>Your one-stop destination for NIMCET 2026 preparation</p>
  <div class="footer-links">
    <a href="index.html">Home</a><a href="syllabus.html">Syllabus</a>
    <a href="notes.html">Notes</a><a href="practice.html">Practice</a>
    <a href="mock-test.html">Mock Tests</a><a href="pricing.html">Pricing</a>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/practice.js"></script>
</body>
</html>
